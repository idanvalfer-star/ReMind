#:schema node_modules/wrangler/config-schema.json
#
# One Worker serves the SPA, the /api routes and the cron. Cloudflare Pages cannot
# host Cron Triggers, so the alternative was two deploys on two origins plus CORS;
# Workers Static Assets is free and same-origin. See DECISIONS.md.

name = "remind"
main = "worker/index.ts"
compatibility_date = "2026-08-11"

[observability]
enabled = true

[assets]
directory = "./dist"
# SPA deep links (/calendar, /settings) must serve index.html rather than 404.
not_found_handling = "single-page-application"
# Explicit: without this, a *navigation* request to /api/* would hit the SPA
# fallback instead of the Worker. Asset-first routing stays in effect for
# everything else, so the Worker is never woken to serve a static file.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "remind-push"
# Replace with the id printed by `npx wrangler d1 create remind-push` (see README).
database_id = "REPLACE_ME"

[triggers]
# Once a minute. 1,440 invocations/day against a 100k/day free-tier ceiling.
crons = ["* * * * *"]

[vars]
# The VAPID *public* key is not a secret — it is handed to the browser at subscribe
# time. The private key is set with `npx wrangler secret put VAPID_PRIVATE_KEY`
# and must never be committed.
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:change-me@example.com"
