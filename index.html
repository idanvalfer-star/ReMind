<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real
         values under the notch / home indicator in standalone mode. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="description" content="A proactive personal memory assistant." />
    <meta name="theme-color" content="#1E1B4B" />

    <!-- iOS home-screen behaviour. `apple-mobile-web-app-capable` is what makes
         navigator.standalone true, which is the precondition for Web Push. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReMind" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <title>ReMind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
